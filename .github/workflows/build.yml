name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              git zip unzip autoconf libtool pkg-config \
              zlib1g-dev libncurses5-dev libncursesw5-dev \
              libtinfo5 cmake libffi-dev libssl-dev openjdk-17-jdk \
              ant build-essential ccache

      - name: Install Buildozer and tools
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade cython
          pip install --upgrade buildozer

      - name: Preinstall Android SDK and Platform-Tools completely
        run: |
          # تجهيز مسارات الـ SDK الكاملة
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          
          # تحميل أدوات سطر الأوامر الحديثة وتثبيتها بشكل صحيح
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmd-tools-temp
          cp -r /tmp/cmd-tools-temp/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
          
          # قبول التراخيص وتثبيت الحزم المطلوبة (platform-tools و platforms) يدوياً لمنع أي فشل لاحق
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Build with Buildozer
        env:
          ANDROIDSDK: "/home/runner/.buildozer/android/platform/android-sdk"
          ANDROIDNDK: "/home/runner/.buildozer/android/platform/android-ndk-r25b"
          ANDROIDAPI: "33"
        run: buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
