name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              git zip unzip autoconf libtool pkg-config \
              zlib1g-dev libncurses5-dev libncursesw5-dev \
              libtinfo5 cmake libffi-dev libssl-dev openjdk-17-jdk \
              ant build-essential ccache

      - name: Install Buildozer and tools
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade cython
          pip install --upgrade buildozer

      - name: Install Android SDK Build-Tools (AIDL fix)
        run: |
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.2
          # تثبيت حزمة الـ build-tools لضمان توفر aidl ومكونات الـ SDK
          sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk "build-tools;33.0.2" "platforms;android-33" || true

      - name: Clear old buildozer cache (keep sdk)
        run: |
          # لا مسح كامل للـ .buildozer حتى نقي المحتوى المحمل، فقط تنظيف الكاش القديم للعبة
          rm -rf .buildozer

      - name: Build with Buildozer
        run: buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
