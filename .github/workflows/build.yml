name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget curl build-essential libssl-dev zlib1g-dev \
            libncurses5-dev libncursesw5-dev libsqlite3-dev \
            libffi-dev unzip zip openjdk-17-jdk

      - name: Install Python Dependencies & Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade cython==0.29.36 virtualenv
          pip install --upgrade buildozer

      - name: Pre-create Buildozer directories and accept SDK licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk
          # تشغيل أمر وهمي لإنشاء هيكل مجلدات الـ SDK وتحميل الـ command-line tools
          buildozer --version

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: bin/*.apk
