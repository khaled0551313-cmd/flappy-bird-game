name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            git wget curl build-essential libssl-dev zlib1g-dev \
            libncurses5-dev libncursesw5-dev libsqlite3-dev \
            libffi-dev unzip zip openjdk-17-jdk ant libltdl7 \
            libstdc++6:i386 libgcc1:i386 zlib1g:i386 libncurses5:i386

      - name: Install Python Dependencies & Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade cython virtualenv
          pip install --upgrade buildozer

      - name: Setup Android SDK and Environment
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools/latest"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/
          rm -rf "$SDK_DIR/cmdline-tools/latest/*"
          mv /tmp/cmdline-tools/* "$SDK_DIR/cmdline-tools/latest/"
          export PATH="$SDK_DIR/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$SDK_DIR" --licenses || true
          yes | sdkmanager --sdk_root="$SDK_DIR" "platforms;android-33" "build-tools;33.0.2" "platform-tools" "ndk;25b"
          mkdir -p "$SDK_DIR/tools/bin"
          ln -sf "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"

      - name: Build APK with Buildozer
        env:
          COLORTERM: "yes"
          TERM: "xterm-256color"
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: bin/*.apk
