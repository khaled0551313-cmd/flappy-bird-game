name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              git zip unzip autoconf libtool pkg-config \
              zlib1g-dev libncurses5-dev libncursesw5-dev \
              libtinfo5 cmake libffi-dev libssl-dev openjdk-17-jdk \
              ant build-essential ccache

      - name: Install Buildozer and tools
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade cython
          pip install --upgrade buildozer

      - name: Setup Android SDK and fix sdkmanager path for Buildozer
        run: |
          # إنشاء هيكل المجلدات الكامل لضمان توافق المسارين القديم والحديث
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/tools/bin
          
          # تحميل أدوات سطر الأوامر الرسمية لأندرويد
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmd-tools-temp
          
          # نسخ الأدوات للمسار الحديث
          cp -r /tmp/cmd-tools-temp/cmdline-tools/* $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/
          
          # عمل نسخة ومسار مطابقة للمسار القديم الذي يبحث عنه buildozer
          cp -r /tmp/cmd-tools-temp/cmdline-tools/bin/* $HOME/.buildozer/android/platform/android-sdk/tools/bin/ || true
          
          rm -rf /tmp/cmdtools.zip /tmp/cmd-tools-temp

      - name: Build with Buildozer
        run: buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
