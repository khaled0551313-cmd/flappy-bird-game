name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              git zip unzip autoconf libtool pkg-config \
              zlib1g-dev libncurses5-dev libncursesw5-dev \
              libtinfo5 cmake libffi-dev libssl-dev openjdk-17-jdk \
              ant build-essential ccache

      - name: Install Buildozer and tools
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade cython
          pip install --upgrade buildozer

      - name: Force setup SDKManager in both old and new paths
        run: |
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          
          # إنشاء كلا المسارين (الحديث والقديم) لضمان عدم فشل Buildozer أبدأً
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          mkdir -p $ANDROID_HOME/tools/bin
          
          # تحميل أدوات سطر الأوامر الرسمية
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmd-tools-temp
          
          # نسخ الأدوات للمسار الحديث
          cp -r /tmp/cmd-tools-temp/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
          
          # نسخ الأدوات وتكرارها بالكامل للمسار القديم الذي يصر بيلدوزر على البحث فيه
          cp -r /tmp/cmd-tools-temp/cmdline-tools/bin/* $ANDROID_HOME/tools/bin/
          cp -r /tmp/cmd-tools-temp/cmdline-tools/lib $ANDROID_HOME/tools/ || true
          
          # قبول التراخيص مسبقاً
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
          
          rm -rf /tmp/cmdtools.zip /tmp/cmd-tools-temp

      - name: Build with Buildozer
        env:
          ANDROIDSDK: "/home/runner/.buildozer/android/platform/android-sdk"
          ANDROIDNDK: "/home/runner/.buildozer/android/platform/android-ndk-r25b"
          ANDROIDAPI: "33"
        run: buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
